name: Deploy Dana Kegiatan

on:
    push:
        branches:
            - main

    workflow_dispatch:

jobs:
    deploy:
        name: Build and Deploy Laravel
        runs-on: ubuntu-latest

        steps:
            # ==========================================
            # CHECKOUT
            # ==========================================
            - name: Checkout
              uses: actions/checkout@v4

            # ==========================================
            # PHP
            # ==========================================
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml
                  coverage: none
                  tools: composer:v2

            - name: Verify PHP
              run: |
                  php -v
                  composer --version

            # ==========================================
            # COMPOSER
            # ==========================================
            - name: Install Composer dependencies
              run: |
                  composer install \
                    --no-dev \
                    --prefer-dist \
                    --optimize-autoloader \
                    --no-interaction

            # ==========================================
            # NODE
            # ==========================================
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install NPM dependencies
              run: npm ci

            # ==========================================
            # BUILD
            # ==========================================
            - name: Build frontend
              run: npm run build

            # ==========================================
            # PREPARE
            # ==========================================
            - name: Prepare deployment
              run: |
                  rm -rf .git
                  rm -rf node_modules

            # ==========================================
            # DEPLOY
            # ==========================================
            - name: Deploy to Hostinger
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  source: "."
                  target: "/home/u426348873/domains/vikaarya07.my.id/public_html/dana-kegiatan"
                  overwrite: true

            # ==========================================
            # LARAVEL PRODUCTION COMMANDS
            # ==========================================
            - name: Run Laravel deployment commands
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script_stop: true
                  script: |
                      cd /home/u426348873/domains/vikaarya07.my.id/public_html/dana-kegiatan

                      echo "========================================"
                      echo "PHP VERSION"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php -v

                      echo "========================================"
                      echo "DATABASE MIGRATION"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php artisan migrate --force

                      echo "========================================"
                      echo "STORAGE LINK"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php artisan storage:link || true

                      echo "========================================"
                      echo "CLEAR CACHE"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php artisan optimize:clear

                      echo "========================================"
                      echo "CACHE CONFIG"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php artisan config:cache

                      echo "========================================"
                      echo "CACHE ROUTES"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php artisan route:cache

                      echo "========================================"
                      echo "CACHE VIEWS"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php artisan view:cache

                      echo "========================================"
                      echo "APPLICATION INFO"
                      echo "========================================"
                      /opt/alt/php85/usr/bin/php artisan about

                      echo "========================================"
                      echo "DEPLOYMENT COMPLETE"
                      echo "========================================"

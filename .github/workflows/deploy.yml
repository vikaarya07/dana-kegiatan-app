name: Deploy Dana Kegiatan

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        name: Build and Deploy Laravel
        runs-on: ubuntu-latest

        steps:
            # ========================================
            # CHECKOUT
            # ========================================
            - name: Checkout
              uses: actions/checkout@v4

            # ========================================
            # PHP
            # ========================================
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml
                  coverage: none
                  tools: composer:v2

            - name: Verify PHP
              run: |
                  php -v
                  composer --version

            # ========================================
            # COMPOSER
            # ========================================
            - name: Install Composer dependencies
              run: |
                  composer install \
                    --no-dev \
                    --prefer-dist \
                    --optimize-autoloader \
                    --no-interaction

            # ========================================
            # NODE
            # ========================================
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install NPM dependencies
              run: npm ci

            # ========================================
            # BUILD VITE
            # ========================================
            - name: Build frontend
              run: npm run build

            # ========================================
            # SETUP SSH
            # ========================================
            - name: Setup SSH
              shell: bash
              run: |
                  set -e

                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

                  echo "Checking SSH private key..."

                  ssh-keygen -y \
                    -f ~/.ssh/id_ed25519 \
                    > ~/.ssh/id_ed25519.pub

                  echo "Private key fingerprint:"
                  ssh-keygen -lf ~/.ssh/id_ed25519.pub

                  echo "Testing private key format..."

                  ssh-keygen \
                    -y \
                    -f ~/.ssh/id_ed25519 \
                    > /dev/null

                  echo "Private key is valid."

                  echo "Adding Hostinger host key..."

                  ssh-keyscan \
                    -p "${{ secrets.SSH_PORT }}" \
                    "${{ secrets.SSH_HOST }}" \
                    >> ~/.ssh/known_hosts

                  chmod 644 ~/.ssh/known_hosts

            # ========================================
            # TEST SSH
            # ========================================
            - name: Test SSH connection
              shell: bash
              run: |
                  set -e

                  echo "Testing SSH connection..."

                  ssh \
                    -i ~/.ssh/id_ed25519 \
                    -p "${{ secrets.SSH_PORT }}" \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    -o BatchMode=yes \
                    -o ConnectTimeout=30 \
                    "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
                    "echo SSH CONNECTION SUCCESS"

            # ========================================
            # DEPLOY FILES
            # ========================================
            - name: Deploy files
              shell: bash
              run: |
                  rsync -az \
                    --delete \
                    --exclude=".git/" \
                    --exclude=".github/" \
                    --exclude=".env" \
                    --exclude="node_modules/" \
                    --exclude="storage/" \
                    -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
                    ./ \
                    "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/u426348873/domains/vikaarya07.my.id/public_html/dana-kegiatan/"

            # ========================================
            # LARAVEL DEPLOYMENT
            # ========================================
            - name: Run Laravel deployment
              shell: bash
              run: |
                  ssh \
                    -i ~/.ssh/id_ed25519 \
                    -p "${{ secrets.SSH_PORT }}" \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    -o BatchMode=yes \
                    -o ConnectTimeout=30 \
                    "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" << 'EOF'

                  set -e

                  cd /home/u426348873/domains/vikaarya07.my.id/public_html/dana-kegiatan

                  echo "========================================"
                  echo "PHP VERSION"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php -v

                  echo "========================================"
                  echo "MIGRATION"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php artisan migrate --force

                  echo "========================================"
                  echo "STORAGE LINK"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php artisan storage:link || true

                  echo "========================================"
                  echo "CLEAR CACHE"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php artisan optimize:clear

                  echo "========================================"
                  echo "CACHE CONFIG"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php artisan config:cache

                  echo "========================================"
                  echo "CACHE ROUTES"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php artisan route:cache

                  echo "========================================"
                  echo "CACHE VIEWS"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php artisan view:cache

                  echo "========================================"
                  echo "PERMISSIONS"
                  echo "========================================"

                  find storage -type d -exec chmod 775 {} \;
                  find storage -type f -exec chmod 664 {} \;

                  find bootstrap/cache -type d -exec chmod 775 {} \;
                  find bootstrap/cache -type f -exec chmod 664 {} \;

                  echo "========================================"
                  echo "APPLICATION INFO"
                  echo "========================================"

                  /opt/alt/php85/usr/bin/php artisan about

                  echo "========================================"
                  echo "DEPLOYMENT COMPLETE"
                  echo "========================================"

                  EOF
